<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Ray's near miss at the Level 3 edge</title>
  <desc id="d">Level 3 deck edge at Riverside. A rail post was pulled at the hoist landing, so the perimeter cable sags. Ray, standing outside the cable, grips a steel column. A crane bundle hangs above. Dee watches from inside the deck. No one is hurt.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE0EE"/><stop offset="1" stop-color="#E8F0F6"/>
    </linearGradient>
  </defs>

  <!-- sky beyond the open bay -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1350" cy="70" rx="140" ry="24" fill="#FFFFFF" opacity=".7"/>

  <!-- L4 slab edge + beam overhead -->
  <rect x="0" y="0" width="1600" height="120" fill="#B9C0C6" stroke="#22303C" stroke-width="2"/>
  <rect x="0" y="120" width="1600" height="24" fill="#4A5B6C" stroke="#22303C" stroke-width="2"/>
  <!-- interior of Level 3 (back of bay) -->
  <polygon points="0,144 1600,144 1600,370 0,370" fill="#DDE5EC"/>
  <g fill="#8C959D" stroke="#22303C" stroke-width="1.5" opacity=".8">
    <rect x="210" y="144" width="12" height="226"/>
    <rect x="620" y="144" width="12" height="226"/>
    <rect x="1030" y="144" width="12" height="226"/>
    <rect x="1440" y="144" width="12" height="226"/>
  </g>

  <!-- Level 3 deck top surface (oblique) -->
  <polygon points="0,560 1600,560 1600,370 0,370" fill="#C9CFD4" stroke="#22303C" stroke-width="2"/>
  <g stroke="#B1B8BE" stroke-width="2">
    <line x1="0" y1="465" x2="1600" y2="465"/>
    <line x1="0" y1="418" x2="1600" y2="418"/>
  </g>
  <!-- slab face + Level 2 below (the drop) -->
  <rect x="0" y="560" width="1600" height="22" fill="#8C959D" stroke="#22303C" stroke-width="2"/>
  <rect x="0" y="582" width="1600" height="258" fill="#5D6E7E"/>
  <g fill="#4A5B6C" stroke="#22303C" stroke-width="2">
    <rect x="410" y="582" width="16" height="258"/>
    <rect x="1250" y="582" width="16" height="258"/>
  </g>
  <rect x="0" y="840" width="1600" height="22" fill="#8C959D" stroke="#22303C" stroke-width="2"/>
  <rect x="0" y="862" width="1600" height="38" fill="#4A5B6C"/>

  <!-- edge column Ray grabs -->
  <rect x="852" y="144" width="22" height="440" fill="#4A5B6C" stroke="#22303C" stroke-width="2.5"/>
  <rect x="846" y="144" width="34" height="10" fill="#4A5B6C" stroke="#22303C" stroke-width="2"/>

  <!-- pallet jack + pulled post lying on deck near hoist landing -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round">
    <rect x="60" y="430" width="120" height="18" rx="3" fill="#F26B1D"/>
    <path d="M150 430 L196 372" stroke-width="5"/>
    <circle cx="80" cy="452" r="7" fill="#22303C"/>
    <circle cx="160" cy="452" r="7" fill="#22303C"/>
    <rect x="200" y="470" width="150" height="10" rx="2" fill="#FFC629" transform="rotate(-8 275 475)"/>
    <rect x="335" y="456" width="20" height="14" fill="#4A5B6C" transform="rotate(-8 275 475)"/>
  </g>
  <!-- empty post socket where the post was pulled -->
  <ellipse cx="682" cy="537" rx="12" ry="5" fill="#22303C"/>

  <!-- perimeter cable rail: posts (set back from the edge) -->
  <g stroke="#22303C" stroke-width="2.5">
    <rect x="135" y="467" width="10" height="70" fill="#FFC629"/>
    <rect x="315" y="467" width="10" height="70" fill="#FFC629"/>
    <rect x="495" y="467" width="10" height="70" fill="#FFC629"/>
    <rect x="1045" y="467" width="10" height="70" fill="#FFC629"/>
    <rect x="1225" y="467" width="10" height="70" fill="#FFC629"/>
    <rect x="1405" y="467" width="10" height="70" fill="#FFC629"/>
  </g>
  <!-- top cable and midrail cable: taut spans, sagging span between post 500 and column 860 -->
  <g fill="none" stroke="#22303C" stroke-width="3">
    <path d="M0 470 L500 470 Q680 540 856 470 L1600 470"/>
    <path d="M0 503 L500 503 Q680 552 856 503 L1600 503"/>
  </g>
  <!-- high-vis flags on the taut top cable -->
  <g fill="#F26B1D" stroke="#22303C" stroke-width="1.5">
    <path d="M226 470 l14 0 l-7 16 z"/><path d="M406 470 l14 0 l-7 16 z"/>
    <path d="M1136 470 l14 0 l-7 16 z"/><path d="M1316 470 l14 0 l-7 16 z"/>
  </g>
  <!-- motion marks at the sag -->
  <g stroke="#F26B1D" stroke-width="3" stroke-linecap="round">
    <path d="M640 548 l-10 14"/><path d="M680 556 l0 16"/><path d="M720 548 l10 14"/>
  </g>

  <!-- crane bundle overhead (deck sheets on slings) -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round">
    <line x1="1010" y1="0" x2="1010" y2="160" stroke-width="3"/>
    <path d="M996 160 a14 14 0 1 0 28 0" fill="none" stroke-width="5"/>
    <path d="M1010 172 L930 250 M1010 172 L1090 250" stroke-width="3"/>
    <g transform="rotate(-6 1010 266)">
      <rect x="900" y="248" width="220" height="40" fill="#9AA7B3"/>
      <path d="M900 258 h220 M900 268 h220 M900 278 h220" stroke="#6E7C88" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Ray: outside the cable on the edge strip, left hand on the column -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M756 556 L766 488 M790 556 L782 488" stroke-width="12" fill="none"/>
    <path d="M752 558 h22 M780 558 h22" stroke-width="7"/>
    <rect x="750" y="410" width="50" height="84" rx="10" fill="#C6E23A" transform="rotate(-10 775 452)"/>
    <path d="M760 420 L792 486 M792 416 L762 488" stroke="#9AA7B3" stroke-width="3"/>
    <path d="M790 424 L850 404" stroke-width="12" fill="none"/>
    <circle cx="853" cy="402" r="8" fill="#D9B08C"/>
    <path d="M762 428 L720 384" stroke-width="12" fill="none"/>
    <circle cx="766" cy="388" r="20" fill="#D9B08C"/>
    <path d="M750 396 Q766 414 782 396 L782 402 Q766 422 750 402 Z" fill="#9AA3AB"/>
    <path d="M744 384 Q766 352 788 384 Z" fill="#FFFFFF"/>
    <rect x="752" y="372" width="28" height="6" rx="2" fill="#22303C"/>
  </g>

  <!-- Dee: inside the rail, deeper on the deck, watching -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M520 468 L524 410 M544 468 L540 410" stroke-width="11" fill="none"/>
    <rect x="510" y="340" width="46" height="76" rx="10" fill="#C6E23A"/>
    <path d="M516 352 L552 360" stroke="#F26B1D" stroke-width="3"/>
    <path d="M514 360 L502 330 M552 360 L566 330" stroke-width="10" fill="none"/>
    <circle cx="533" cy="314" r="18" fill="#8A5A3C"/>
    <path d="M513 312 Q533 282 553 312 Z" fill="#3FA34D"/>
  </g>
</svg>
