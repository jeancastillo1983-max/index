<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Rescue options at Riverside</title>
  <desc id="d">Cutaway of the Riverside building. A worker hangs on an SRL below the Level 3 deck edge. A boom lift brings its basket beside her. A rescue kit is staged on Level 3. A crew member waits at the gate for EMS.</desc>
  <defs>
    <pattern id="fence" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0 L16 16 M16 0 L0 16" stroke="#8C959D" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE0EE"/><stop offset="1" stop-color="#E8F0F6"/>
    </linearGradient>
  </defs>

  <!-- sky + ground -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1180" cy="120" rx="120" ry="26" fill="#FFFFFF" opacity=".7"/>
  <ellipse cx="1290" cy="140" rx="90" ry="20" fill="#FFFFFF" opacity=".6"/>
  <ellipse cx="300" cy="90" rx="110" ry="22" fill="#FFFFFF" opacity=".55"/>
  <rect y="760" width="1600" height="140" fill="#A9B1B8"/>
  <rect y="760" width="1600" height="8" fill="#8C959D"/>
  <rect x="880" y="780" width="420" height="10" rx="3" fill="#8C959D" opacity=".6"/>

  <!-- building interior + structure -->
  <rect x="110" y="232" width="600" height="528" fill="#E6ECF1" stroke="#22303C" stroke-width="2"/>
  <g fill="#4A5B6C" stroke="#22303C" stroke-width="2">
    <rect x="134" y="232" width="14" height="528"/>
    <rect x="324" y="232" width="14" height="528"/>
    <rect x="514" y="232" width="14" height="528"/>
    <rect x="688" y="232" width="14" height="528"/>
  </g>
  <!-- slabs: roof, L4, L3, L2 (14 ft floor to floor) -->
  <g stroke="#22303C" stroke-width="2">
    <rect x="104" y="222" width="606" height="16" fill="#B9C0C6"/>
    <rect x="104" y="358" width="606" height="16" fill="#B9C0C6"/>
    <rect x="104" y="488" width="606" height="16" fill="#B9C0C6"/>
    <rect x="104" y="618" width="606" height="16" fill="#B9C0C6"/>
  </g>
  <!-- beams under slabs -->
  <g fill="#4A5B6C" stroke="#22303C" stroke-width="1.5">
    <rect x="110" y="238" width="600" height="9"/>
    <rect x="110" y="374" width="600" height="9"/>
    <rect x="110" y="504" width="600" height="9"/>
    <rect x="110" y="634" width="600" height="9"/>
  </g>
  <!-- roof parapet + roof membrane line -->
  <rect x="104" y="208" width="606" height="14" fill="#8C959D" stroke="#22303C" stroke-width="2"/>
  <!-- L4 perimeter cable rail -->
  <g stroke="#22303C" stroke-width="3">
    <line x1="700" y1="358" x2="700" y2="318"/>
    <line x1="604" y1="358" x2="604" y2="318"/>
  </g>
  <line x1="596" y1="322" x2="708" y2="322" stroke="#22303C" stroke-width="2"/>
  <line x1="596" y1="340" x2="708" y2="340" stroke="#22303C" stroke-width="2"/>
  <!-- ground floor storefront -->
  <rect x="160" y="660" width="150" height="100" fill="#DCE8F2" stroke="#22303C" stroke-width="2"/>
  <rect x="350" y="660" width="150" height="100" fill="#DCE8F2" stroke="#22303C" stroke-width="2"/>

  <!-- overhead anchor: beam clamp on L4 beam + SRL housing -->
  <g stroke="#22303C" stroke-width="2.5">
    <path d="M638 383 L638 395 L662 395 L662 383" fill="none"/>
    <rect x="644" y="393" width="12" height="10" fill="#F26B1D"/>
    <rect x="634" y="402" width="32" height="34" rx="12" fill="#8C959D"/>
    <circle cx="650" cy="419" r="7" fill="#4A5B6C"/>
  </g>
  <!-- SRL line to the hanging worker's back D-ring -->
  <path d="M650 436 L742 586" stroke="#22303C" stroke-width="3" fill="none"/>

  <!-- rescue kit staged on L3 (gang box + red rescue bag) -->
  <g stroke="#22303C" stroke-width="2">
    <rect x="540" y="452" width="56" height="36" rx="3" fill="#F26B1D"/>
    <rect x="540" y="452" width="56" height="8" fill="#B4460A"/>
    <rect x="552" y="420" width="34" height="34" rx="8" fill="#C23A2E"/>
    <path d="M562 437 h14 M569 430 v14" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Tasha on Level 3, tied off overhead, talking to Dee -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round">
    <line x1="622" y1="383" x2="622" y2="420" stroke-width="2"/>
    <path d="M606 488 L612 456 M630 488 L624 456" fill="none" stroke-width="7" stroke-linecap="round"/>
    <rect x="603" y="420" width="32" height="40" rx="6" fill="#C6E23A"/>
    <path d="M608 422 L632 458 M632 422 L608 458" stroke="#F26B1D" stroke-width="3"/>
    <path d="M634 430 L660 418" stroke-width="7" stroke-linecap="round"/>
    <circle cx="619" cy="406" r="12" fill="#C89B5C"/>
    <path d="M605 404 Q619 386 633 404 Z" fill="#FFFFFF"/>
    <rect x="612" y="395" width="8" height="5" fill="#F26B1D" stroke="none"/>
  </g>

  <!-- Dee hanging outside the L3 edge, feet in relief strap -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M736 600 L728 560 M756 600 L764 560" stroke-width="7" fill="none"/>
    <rect x="730" y="586" width="32" height="50" rx="7" fill="#C6E23A" transform="rotate(-6 746 610)"/>
    <path d="M734 590 L760 632 M760 590 L736 632" stroke="#F26B1D" stroke-width="3"/>
    <path d="M738 636 L732 690 M756 636 L760 690" stroke-width="8" fill="none"/>
    <path d="M744 618 Q712 660 726 694 L768 694 Q776 660 752 618" stroke="#F26B1D" stroke-width="3" fill="none"/>
    <circle cx="747" cy="572" r="13" fill="#8A5A3C"/>
    <path d="M733 568 Q747 550 761 568 Z" fill="#3FA34D"/>
    <circle cx="742" cy="586" r="4" fill="#FFC629"/>
  </g>

  <!-- boom lift: chassis, turret, boom, basket with Ray -->
  <g stroke="#22303C" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="980" cy="752" r="18" fill="#22303C"/>
    <circle cx="1140" cy="752" r="18" fill="#22303C"/>
    <rect x="950" y="712" width="220" height="36" rx="6" fill="#FFC629"/>
    <rect x="1000" y="684" width="70" height="30" rx="4" fill="#FFC629"/>
    <path d="M1030 694 L872 604" stroke-width="22" stroke="#22303C" stroke-linecap="round"/>
    <path d="M1030 694 L872 604" stroke-width="16" stroke="#FFC629" stroke-linecap="round"/>
    <line x1="872" y1="604" x2="840" y2="604" stroke-width="10"/>
    <rect x="784" y="578" width="72" height="36" fill="#4A5B6C" opacity=".35"/>
    <path d="M784 548 L856 548 M784 548 L784 614 L856 614 L856 548 M784 566 L856 566" fill="none" stroke-width="3"/>
  </g>
  <g stroke="#22303C" stroke-width="2.5">
    <rect x="806" y="532" width="28" height="34" rx="6" fill="#C6E23A"/>
    <circle cx="820" cy="518" r="12" fill="#D9B08C"/>
    <path d="M808 524 Q820 536 832 524" fill="#9AA3AB"/>
    <path d="M806 514 Q820 496 834 514 Z" fill="#FFFFFF"/>
    <path d="M808 540 L790 552" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- site fence, gate, runner, ambulance -->
  <rect x="1240" y="690" width="140" height="70" fill="url(#fence)" stroke="#8C959D" stroke-width="2"/>
  <rect x="1490" y="690" width="110" height="70" fill="url(#fence)" stroke="#8C959D" stroke-width="2"/>
  <g fill="#4A5B6C"><rect x="1236" y="684" width="8" height="76"/><rect x="1376" y="684" width="8" height="76"/><rect x="1486" y="684" width="8" height="76"/></g>
  <g stroke="#22303C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1424 758 L1428 724 M1444 758 L1440 724" stroke-width="7" fill="none"/>
    <rect x="1418" y="686" width="32" height="42" rx="6" fill="#C6E23A"/>
    <path d="M1446 692 L1468 650" stroke-width="7"/>
    <path d="M1422 696 L1406 722" stroke-width="7"/>
    <circle cx="1434" cy="672" r="12" fill="#C89B5C"/>
    <path d="M1420 668 Q1434 650 1448 668 Z" fill="#FFFFFF"/>
  </g>
  <g stroke="#22303C" stroke-width="2.5">
    <rect x="1520" y="640" width="120" height="96" rx="8" fill="#FFFFFF"/>
    <rect x="1520" y="690" width="120" height="12" fill="#C23A2E" stroke="none"/>
    <rect x="1530" y="652" width="34" height="26" fill="#DCE8F2"/>
    <circle cx="1556" cy="740" r="16" fill="#22303C"/>
  </g>

  <!-- voice line from Tasha to Dee -->
  <path d="M664 410 Q700 470 726 548" stroke="#F26B1D" stroke-width="2.5" stroke-dasharray="6 7" fill="none"/>
</svg>
