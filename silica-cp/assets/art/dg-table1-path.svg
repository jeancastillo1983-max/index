<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Table 1 decision path: find the task, read the controls, check fully and properly, indoor or outdoor, total hours, then read the respirator column. Off the table means exposure assessment.">
<title>Table 1 decision path: find the task, read the controls, check fully and properly, indoor or outdoor, total hours, then read the respirator column. Off the table means exposure assessment.</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE0EE"/><stop offset="1" stop-color="#EEF3F7"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7AFB6"/><stop offset="1" stop-color="#C3C9CE"/></linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9B4A6"/><stop offset="1" stop-color="#CFC9BA"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
<radialGradient id="puff"><stop offset="0" stop-color="#CFC4AE" stop-opacity="1"/><stop offset=".65" stop-color="#CFC4AE" stop-opacity=".8"/><stop offset="1" stop-color="#CFC4AE" stop-opacity="0"/></radialGradient><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#22303C"/></marker><marker id="ahX" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#22303C"/></marker><marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#C23A2E"/></marker><marker id="ahrX" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#C23A2E"/></marker></defs>
<rect width="1200" height="640" rx="22" fill="#F4F6F8"/><rect x="30" y="40" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#22303C" stroke-width="3"/><text x="200" y="84" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">1 · Find the task</text><text x="200" y="112" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">equipment or task row in Table 1</text><rect x="430" y="40" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#22303C" stroke-width="3"/><text x="600" y="84" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">2 · Read the controls</text><text x="600" y="112" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">water, shroud + collector, cab</text><rect x="830" y="40" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#22303C" stroke-width="3"/><text x="1000" y="84" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">3 · Fully and properly?</text><text x="1000" y="112" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">flow, airflow, filter, seals</text><rect x="830" y="230" width="340" height="96" rx="16" fill="#E1EEFF" stroke="#22303C" stroke-width="3"/><text x="1000" y="274" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">4 · Indoors or out?</text><text x="1000" y="302" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">some rows change indoors</text><rect x="430" y="230" width="340" height="96" rx="16" fill="#E1EEFF" stroke="#22303C" stroke-width="3"/><text x="600" y="274" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">5 · Total Table 1 hours</text><text x="600" y="302" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">all tasks, whole shift</text><rect x="30" y="230" width="340" height="96" rx="16" fill="#DFF3DF" stroke="#22303C" stroke-width="3"/><text x="200" y="274" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">6 · Read the respirator</text><text x="200" y="302" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">≤ 4 hr or > 4 hr column</text><rect x="30" y="430" width="540" height="130" rx="16" fill="#DFF3DF" stroke="#22303C" stroke-width="3"/><text x="300" y="491" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">Controls working + right respirator</text><text x="300" y="519" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">You comply without air sampling</text><rect x="630" y="430" width="540" height="130" rx="16" fill="#FBE1DE" stroke="#22303C" stroke-width="3"/><text x="900" y="491" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="26" fill="#22303C">Off the table</text><text x="900" y="519" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">Task not listed, or controls not fully and properly</text><text x="900" y="540" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#22303C">implemented → exposure assessment (Module 5)</text><line x1="370" y1="88" x2="426" y2="88" stroke="#22303C" stroke-width="3.5" marker-end="url(#ah)"/><line x1="770" y1="88" x2="826" y2="88" stroke="#22303C" stroke-width="3.5" marker-end="url(#ah)"/><line x1="1000" y1="136" x2="1000" y2="226" stroke="#22303C" stroke-width="3.5" marker-end="url(#ah)"/><line x1="830" y1="278" x2="774" y2="278" stroke="#22303C" stroke-width="3.5" marker-end="url(#ah)"/><line x1="430" y1="278" x2="374" y2="278" stroke="#22303C" stroke-width="3.5" marker-end="url(#ah)"/><line x1="200" y1="326" x2="200" y2="426" stroke="#22303C" stroke-width="3.5" marker-end="url(#ah)"/><path d="M1170 88 C 1196 88, 1196 300, 1100 426" fill="none" stroke="#C23A2E" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ahr)"/><text x="1150" y="210" text-anchor="end" font-family="Public Sans,Arial" font-weight="700" font-size="18" fill="#C23A2E">no</text><path d="M120 40 C 120 10, 700 6, 760 426" fill="none" stroke="#C23A2E" stroke-width="3" stroke-dasharray="10 8" opacity=".0"/>
</svg>
