<rect width="1200" height="700" rx="22" fill="#F4F6F8"/><rect x="60" y="60" width="1080" height="580" fill="#E3E8EC" stroke="#22303C" stroke-width="6"/><rect x="230" y="190" width="20" height="20" fill="#4A5B6C"/><rect x="230" y="410" width="20" height="20" fill="#4A5B6C"/><rect x="530" y="190" width="20" height="20" fill="#4A5B6C"/><rect x="530" y="410" width="20" height="20" fill="#4A5B6C"/><rect x="830" y="190" width="20" height="20" fill="#4A5B6C"/><rect x="830" y="410" width="20" height="20" fill="#4A5B6C"/><rect x="60" y="60" width="160" height="200" fill="#C2C7CB" stroke="#22303C" stroke-width="3"/><text x="140" y="168" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="20" fill="#22303C">Stair + elevator</text><rect x="520" y="280" width="300" height="220" fill="#FBE1DE" stroke="#C23A2E" stroke-width="3" stroke-dasharray="12 8"/><text x="670" y="380" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="30" fill="#C23A2E">SLAB CUTTING</text><text x="670" y="410" text-anchor="middle" font-family="Public Sans,Arial" font-size="18" fill="#22303C">handheld + walk-behind saws</text><rect x="880" y="100" width="240" height="160" fill="#E2ECF8" stroke="#1F5FAE" stroke-width="3"/><text x="1000" y="186" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="20" fill="#1F5FAE">Drywall crew</text><path d="M220 160 L460 160 L460 600 L1140 600" fill="none" stroke="#6E7C88" stroke-width="10" stroke-dasharray="4 14" stroke-linecap="round"/><text x="300" y="148" font-family="Public Sans,Arial" font-size="18" fill="#4F5D6A">main route from the stairs</text><line x1="1140" y1="300" x2="1140" y2="560" stroke="#7FA9C9" stroke-width="10"/><text x="1120" y="440" text-anchor="end" font-family="Public Sans,Arial" font-size="16" fill="#4F5D6A">open window wall</text><text x="70" y="680" font-family="Public Sans,Arial" font-size="18" fill="#4F5D6A">Level 2 · north is up · not to scale</text>
