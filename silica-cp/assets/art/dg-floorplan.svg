<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Level 2 floor plan: stair and elevator core at top left, a slab cutting area in the middle, the drywall crew at the top right, the main walking route from the stairs, and an open window wall on the east side.">
<title>Level 2 floor plan: stair and elevator core at top left, a slab cutting area in the middle, the drywall crew at the top right, the main walking route from the stairs, and an open window wall on the east side.</title>
<defs>
