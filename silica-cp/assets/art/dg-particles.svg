"330" cy="430" r="2" fill="#22303C"/><circle cx="280" cy="455" r="3" fill="#22303C"/><circle cx="350" cy="410" r="3.8" fill="#22303C"/><circle cx="205" cy="430" r="2.2" fill="#22303C"/><circle cx="280" cy="425" r="74" fill="none" stroke="#C23A2E" stroke-width="4" stroke-dasharray="10 8"/><text x="380" y="408" font-family="Public Sans,Arial" font-weight="800" font-size="26" fill="#C23A2E">Respirable silica</text><text x="380" y="440" font-family="Public Sans,Arial" font-size="21" fill="#22303C">under 10 µm. Small enough to reach</text><text x="380" y="468" font-family="Public Sans,Arial" font-size="21" fill="#22303C">the deepest part of the lung.</text><text x="60" y="530" font-family="Public Sans,Arial" font-size="18" fill="#4F5D6A">Visible dust is the big stuff. The particles that cause silicosis are too small to see.</text>
</svg>
