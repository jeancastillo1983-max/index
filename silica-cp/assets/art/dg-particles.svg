<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Size comparison at the same magnification: a grain of sand fills the frame, a human hair is a thick band, and respirable silica particles are tiny dots.">
