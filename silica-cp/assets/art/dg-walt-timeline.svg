<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Walt's timeline: starts dry-cutting block in 1974, mason and foreman in the 1990s, retires in 2012 with a cough, diagnosed with chronic silicosis in 2016, on oxygen today.">
<title>Walt's timeline: starts dry-cutting block in 1974, mason and foreman in the 1990s, retires in 2012 with a cough, diagnosed with chronic silicosis in 2016, on oxygen today.</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE0EE"/><stop offset="1" stop-color="#EEF3F7"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7AFB6"/><stop offset="1" stop-color="#C3C9CE"/></linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9B4A6"/><stop offset="1" stop-color="#CFC9BA"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
<radialGradient id="puff"><stop offset="0" stop-color="#CFC4AE" stop-opacity="1"/><stop offset=".65" stop-color="#CFC4AE" stop-opacity=".8"/><stop offset="1" stop-color="#CFC4AE" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="420" rx="22" fill="#F4F1EA"/><line x1="80" y1="230" x2="1120" y2="230" stroke="#22303C" stroke-width="5" stroke-linecap="round" /><circle cx="120" cy="230" r="16" fill="#0074E4" stroke="#22303C" stroke-width="3"/><text x="120" y="150" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="34" fill="#22303C">1974</text><text x="120" y="182" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="19" fill="#22303C">Starts as a laborer</text><text x="120" y="112" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#4F5D6A">Dry cutting block</text><circle cx="380" cy="230" r="16" fill="#0074E4" stroke="#22303C" stroke-width="3"/><text x="380" y="300" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="34" fill="#22303C">1990s</text><text x="380" y="332" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="19" fill="#22303C">Mason, then foreman</text><text x="380" y="358" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#4F5D6A">"Just dust"</text><circle cx="640" cy="230" r="16" fill="#0074E4" stroke="#22303C" stroke-width="3"/><text x="640" y="150" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="34" fill="#22303C">2012</text><text x="640" y="182" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="19" fill="#22303C">Retires at 60</text><text x="640" y="112" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#4F5D6A">A cough that won't quit</text><circle cx="900" cy="230" r="16" fill="#C23A2E" stroke="#22303C" stroke-width="3"/><text x="900" y="300" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="34" fill="#22303C">2016</text><text x="900" y="332" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="19" fill="#22303C">Diagnosis</text><text x="900" y="358" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#4F5D6A">Chronic silicosis</text><circle cx="1100" cy="230" r="16" fill="#C23A2E" stroke="#22303C" stroke-width="3"/><text x="1100" y="150" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="34" fill="#22303C">Today</text><text x="1100" y="182" text-anchor="middle" font-family="Public Sans,Arial" font-weight="700" font-size="19" fill="#22303C">Oxygen, 24/7</text><text x="1100" y="112" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#4F5D6A">Grandson's games</text><text x="600" y="402" text-anchor="middle" font-family="Public Sans,Arial" font-size="17" fill="#4F5D6A">38 years of exposure. Symptoms showed up after he retired.</text>
</svg>
